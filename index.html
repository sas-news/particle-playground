<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Particle Playground</title>
<style>
  :root {
    --bg: #0a0d13;
    --panel: #111721;
    --line: #26303f;
    --text: #e8edf5;
    --dim: #8a94a6;
    --accent: #5fb3a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); min-height: 100%; }
  body {
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 20px 40px; }
  .kicker { font-size: 10px; letter-spacing: .22em; color: var(--dim); }
  h1 { margin: 10px 0 10px; font-size: clamp(30px, 5vw, 46px); font-weight: 800; line-height: 1.1; }
  .lead { margin: 0 0 30px; font-size: 13px; color: var(--dim); }

  .featured {
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 0;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    text-decoration: none; background: var(--panel);
  }
  .featured img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 220px; }
  .featured div { padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .featured h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .featured p { margin: 0; font-size: 12px; line-height: 1.8; color: var(--dim); }
  .featured .go { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--accent); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .card {
    display: block; padding: 18px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); text-decoration: none;
  }
  .card:hover, .featured:hover { border-color: #3a4759; }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
  .card p { margin: 0; font-size: 11px; line-height: 1.7; color: var(--dim); }
  .card .go { display: inline-block; margin-top: 10px; font-size: 11px; color: var(--accent); }

  .old { margin-top: 26px; font-size: 10px; color: var(--dim); line-height: 2; }
  .old a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 10px; color: var(--dim); display: flex; justify-content: space-between; gap: 12px; }
  .footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }

  @media (max-width: 660px) {
    .wrap { padding: 30px 16px 28px; }
    .featured { grid-template-columns: 1fr; }
    .featured img { min-height: 180px; }
    .row { grid-template-columns: 1fr; }
    .footer { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">PARTICLE LIFE</div>
  <h1>Particle Playground</h1>
  <p class="lead">吸引行列から生まれる群れで遊ぶ。</p>

  <a class="featured" href="tug.html">
    <img src="img/tug-feature.jpg" alt="Particle Tug">
    <div>
      <h2>Particle Tug</h2>
      <p>磁力で粒子を引き寄せ、陣地に集める。75秒で多いほうの勝ち。1人（CPU）か2人対戦。</p>
      <span class="go">あそぶ →</span>
    </div>
  </a>

  <div class="row">
    <a class="card" href="lab.html">
      <h3>Particle Lab</h3>
      <p>引力・斥力の行列をランダム化して、生態系を観察する。</p>
      <span class="go">あそぶ →</span>
    </a>
    <a class="card" href="https://github.com/sas-news/particle-playground" target="_blank" rel="noopener">
      <h3>GitHub</h3>
      <p>ソースとビルド手順。</p>
      <span class="go">開く →</span>
    </a>
  </div>

  <div class="old">
    旧作: <a href="derby.html">Particle Derby</a> ／ <a href="scoop.html">Particle Scoop</a>
  </div>

  <div class="footer">
    <span>元ネタ: <a href="https://cerevisiae-fii.github.io/particle-life/" target="_blank" rel="noopener">Particle Life</a>（非公式）</span>
    <span>効果音が出ます。</span>
  </div>
</div>
</body>
</html>
