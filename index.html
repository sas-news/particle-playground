<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Particle Playground — パーティクルライフで遊ぶ</title>
<style>
  :root {
    --bg: #04060e;
    --panel: rgba(11,17,31,.7);
    --line: rgba(150,200,255,.15);
    --text: #eaf2ff;
    --dim: #8ea3c2;
    --gold: #ffd166;
    --mint: #6ef2c0;
    --violet: #b79bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI",
                 "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(70% 55% at 18% 0%, rgba(50, 150, 220, .16), transparent 60%),
      radial-gradient(60% 50% at 92% 10%, rgba(255, 150, 170, .12), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(110, 242, 192, .08), transparent 60%),
      #04060e;
  }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 58px 22px 40px; }

  .kicker { font-size: 10px; letter-spacing: .4em; color: var(--dim); text-transform: uppercase; }
  h1 {
    margin: 12px 0 14px; font-size: clamp(36px, 6.6vw, 76px); line-height: 1.02; letter-spacing: .01em;
    background: linear-gradient(100deg, #a9ffe3 4%, #7fc6ff 38%, #ffd166 70%, #ffb2c2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 10px 40px rgba(96, 220, 255, .22));
  }
  .lead { max-width: 640px; margin: 0 0 34px; font-size: 14px; line-height: 2; color: var(--dim); }
  .lead b { color: var(--text); font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
    text-decoration: none; color: var(--text);
    transition: transform .18s ease, border-color .18s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.28); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .card .shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #070c16; }
  .card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
  .card .shot::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(4,6,14,0) 45%, rgba(4,6,14,.86) 100%);
  }
  .card .num {
    position: absolute; left: 14px; top: 12px; z-index: 2;
    font-size: 10px; letter-spacing: .2em; color: rgba(255,255,255,.75);
    padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(5,8,16,.45); backdrop-filter: blur(6px);
  }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  .card p { margin: 0; font-size: 12px; line-height: 1.85; color: var(--dim); flex: 1; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 9px; letter-spacing: .12em; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
  .card .go { margin-top: 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
  .card.derby .go { color: var(--gold); }
  .card.scoop .go { color: var(--mint); }
  .card.lab .go { color: var(--violet); }
  .card.derby:hover { box-shadow: 0 24px 60px rgba(255,209,102,.10), 0 24px 60px rgba(0,0,0,.45); }
  .card.scoop:hover { box-shadow: 0 24px 60px rgba(110,242,192,.10), 0 24px 60px rgba(0,0,0,.45); }
  .card.lab:hover { box-shadow: 0 24px 60px rgba(183,155,255,.10), 0 24px 60px rgba(0,0,0,.45); }

  .about {
    margin-top: 42px; padding-top: 22px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 26px;
    font-size: 11px; line-height: 2; color: var(--dim);
  }
  .about b { color: var(--text); }
  .about a { color: rgba(210,230,255,.92); text-decoration: none; border-bottom: 1px dotted rgba(160,190,230,.4); }
  .about .right { text-align: right; }
  @media (max-width: 860px) {
    .wrap { padding: 36px 16px 28px; }
    .grid { grid-template-columns: 1fr; }
    .card .shot { aspect-ratio: 16 / 8; }
    .about { grid-template-columns: 1fr; gap: 14px; }
    .about .right { text-align: left; }
    .lead { margin-bottom: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Particle Life Playground</div>
  <h1>Particle<br>Playground</h1>
  <p class="lead">吸引行列から生まれる群れで遊ぶ、3つの実験。</p>

  <div class="grid">
    <a class="card derby" href="derby.html">
      <div class="shot"><img src="img/derby.jpg" alt="Particle Derby"></div>
      <div class="body">
        <h2>Particle Derby</h2>
        <p>群れの生き残りを予想してチップを賭ける。3レース。</p>
        <div class="meta"><span class="tag">1人プレイ</span><span class="tag">予想・ベット</span><span class="tag">90秒 × 3</span></div>
        <div class="go">あそぶ →</div>
      </div>
    </a>

    <a class="card scoop" href="scoop.html">
      <div class="shot"><img src="img/scoop.jpg" alt="Particle Scoop"></div>
      <div class="body">
        <h2>Particle Scoop</h2>
        <p>群れを90秒ですくい集める。</p>
        <div class="meta"><span class="tag">1人プレイ</span><span class="tag">捕獲</span><span class="tag">90秒</span></div>
        <div class="go">あそぶ →</div>
      </div>
    </a>

    <a class="card lab" href="lab.html">
      <div class="shot"><img src="img/lab.jpg" alt="Particle Lab"></div>
      <div class="body">
        <h2>Particle Lab</h2>
        <p>行列をランダム化して、生態系を観察する。</p>
        <div class="meta"><span class="tag">観察</span><span class="tag">ランダム化</span><span class="tag">自動</span></div>
        <div class="go">あそぶ →</div>
      </div>
    </a>
  </div>

  <div class="about">
    <div>
      <b>元ネタ</b>: <a href="https://cerevisiae-fii.github.io/particle-life/" target="_blank" rel="noopener">Particle Life</a>（非公式）<br>
      効果音が出ます。
    </div>
    <div class="right">
      <a href="https://github.com/sas-news/particle-playground" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</div>
</body>
</html>
